<style>
body{margin:0;font-family:'Inter',sans-serif}
*{box-sizing:border-box}
.jk{font-family:'Plus Jakarta Sans',sans-serif}
.tn{font-variant-numeric:tabular-nums}
.card{background:#242424;border:1px solid #353535;border-radius:24px}
.lab{font:600 11px/16px 'Inter',sans-serif;letter-spacing:.8px;text-transform:uppercase;color:#A3A3A3}
.btn{height:56px;border-radius:28px;border:0;font:700 16px 'Plus Jakarta Sans',sans-serif;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 24px;cursor:pointer}
.pri{background:#FF6B24;color:#101010}
.sec{background:transparent;color:#fff;border:1.5px solid #353535}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.in{animation:up .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes ring{from{stroke-dashoffset:390}to{stroke-dashoffset:156}}
.rp{animation:ring 1.2s cubic-bezier(.2,.8,.2,1) .2s both}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.fb{transform-origin:left;animation:fill 1s cubic-bezier(.2,.8,.2,1) .4s both}
@property --n{syntax:'<integer>';inherits:false;initial-value:24}
@keyframes cnt{from{--n:0}to{--n:24}}
.cnt{animation:cnt 1.2s ease-out .2s both;counter-reset:n var(--n)}
.cnt::after{content:counter(n)}
@keyframes br{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
.mb{transform-origin:50% 92%;animation:br 3.6s ease-in-out infinite}
@keyframes bl{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.eye{transform-box:fill-box;transform-origin:center;animation:bl 4.5s infinite}
@media (prefers-reduced-motion:reduce){
*{animation:none !important}
}

@keyframes ring2{from{stroke-dashoffset:60}to{stroke-dashoffset:0}}
.r2{animation:ring2 1.4s cubic-bezier(.2,.8,.2,1) .2s both}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.fl{animation:fl 4s ease-in-out infinite}

.pl{animation:pl 2s infinite}

.pg{background:#FF6B24;color:#101010;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.lk{background:none;border:0;font:600 15px Inter,sans-serif;color:#A3A3A3;height:44px;cursor:pointer;text-decoration:underline;text-underline-offset:4px}

.rg{animation:pr 3.2s ease-out infinite}

.rs{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes ld{from{transform:scaleX(.05)}to{transform:scaleX(.66)}}

@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.gr{transform-origin:bottom;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}

.mb{transform-box:fill-box;transform-origin:50% 100%}
.eye{transform-box:fill-box;transform-origin:center}
@property --c{syntax:'<integer>';inherits:false;initial-value:24}
@property --d{syntax:'<integer>';inherits:false;initial-value:16}

.k1{animation:cnt2 6s steps(3) infinite;counter-reset:cc var(--c) dd var(--d)}
.k1 .a::after{content:counter(cc)}.k1 .b::after{content:counter(dd)}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 20s linear infinite}.spinr{animation:spin 20s linear infinite reverse}

.sw{animation:swipe 6s cubic-bezier(.7,0,.2,1) infinite}
@keyframes v1{0%,34%{opacity:1}40%,100%{opacity:0}}
@keyframes v2{0%,34%{opacity:0}40%,66%{opacity:1}72%,100%{opacity:0}}
@keyframes v3{0%,66%{opacity:0}72%,96%{opacity:1}100%{opacity:0}}
.v1{animation:v1 7s infinite}.v2{animation:v2 7s infinite}.v3{animation:v3 7s infinite}
@keyframes fillr{0%{stroke-dashoffset:100}85%,100%{stroke-dashoffset:8}}
.fr{animation:fillr 7s ease-in-out infinite}
@keyframes bar{0%{transform:scaleX(.1)}90%,100%{transform:scaleX(1)}}
.xb{transform-origin:left;animation:bar 7s ease-in-out infinite}

@keyframes shake{0%,100%{transform:translateX(0) rotate(0)}20%{transform:translateX(-4px) rotate(-1.5deg)}40%{transform:translateX(4px) rotate(1.5deg)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.shk{animation:shake .35s linear infinite}
@keyframes pop{0%{transform:scale(.2);opacity:0}55%{transform:scale(1.14);opacity:1}100%{transform:scale(1)}}
.pop{animation:pop 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
.fls{animation:flash 1.6s ease-out both}

.pt{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px;border-radius:50%;background:#FFB27F;animation:conv 2.2s ease-in infinite}

.cf{position:absolute;top:0;animation:fall 5s linear infinite}
@keyframes hold{0%{stroke-dashoffset:100}80%,100%{stroke-dashoffset:0}}
.hd{animation:hold 2.6s ease-in-out infinite}
@keyframes rip{0%{transform:scale(.7);opacity:.6}100%{transform:scale(1.6);opacity:0}}
.rip{animation:rip 1.6s ease-out infinite}
@keyframes ray{to{transform:translate(-50%,-50%) rotate(360deg)}}
.rays{position:absolute;left:50%;top:var(--ty);width:760px;height:760px;transform:translate(-50%,-50%);background:repeating-conic-gradient(rgba(255,138,76,.2) 0 7deg,transparent 7deg 22deg);-webkit-mask-image:radial-gradient(circle,#000 8%,transparent 62%);mask-image:radial-gradient(circle,#000 8%,transparent 62%);animation:ray 40s linear infinite}

.mb{animation:mbr 3.6s ease-in-out infinite}.eye{animation:bl 4.5s infinite}
