<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>31 Focus Session Setup · Scrola</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',sans-serif}
*{box-sizing:border-box}
.jk{font-family:'Plus Jakarta Sans',sans-serif}
.tn{font-variant-numeric:tabular-nums}
.card{background:#242424;border:1px solid #353535;border-radius:24px}
.lab{font:600 11px/16px 'Inter',sans-serif;letter-spacing:.8px;text-transform:uppercase;color:#A3A3A3}
.btn{height:56px;border-radius:28px;border:0;font:700 16px 'Plus Jakarta Sans',sans-serif;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 24px;cursor:pointer}
.pri{background:#FF6B24;color:#101010}
.sec{background:transparent;color:#fff;border:1.5px solid #353535}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.in{animation:up .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes ring{from{stroke-dashoffset:390}to{stroke-dashoffset:156}}
.rp{animation:ring 1.2s cubic-bezier(.2,.8,.2,1) .2s both}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.fb{transform-origin:left;animation:fill 1s cubic-bezier(.2,.8,.2,1) .4s both}
@property --n{syntax:'<integer>';inherits:false;initial-value:24}
@keyframes cnt{from{--n:0}to{--n:24}}
.cnt{animation:cnt 1.2s ease-out .2s both;counter-reset:n var(--n)}
.cnt::after{content:counter(n)}
@keyframes br{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
.mb{transform-origin:50% 92%;animation:br 3.6s ease-in-out infinite}
@keyframes bl{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.eye{transform-box:fill-box;transform-origin:center;animation:bl 4.5s infinite}
@media (prefers-reduced-motion:reduce){
*{animation:none !important}
}

.gl{background:#1A1A1A;border:1px solid #2A2A2A;border-radius:24px}.gl.fl{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.12);backdrop-filter:blur(14px)}
@keyframes ring2{from{stroke-dashoffset:60}to{stroke-dashoffset:0}}
.r2{animation:ring2 1.4s cubic-bezier(.2,.8,.2,1) .2s both}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.fl{animation:fl 4s ease-in-out infinite}
@keyframes pl{0%,100%{box-shadow:0 0 0 0 rgba(255,107,36,.5)}50%{box-shadow:0 0 0 7px rgba(255,107,36,0)}}
.pl{animation:pl 2s infinite}

.pg{background:#FF6B24;color:#101010;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.lk{background:none;border:0;font:600 15px Inter,sans-serif;color:#A3A3A3;height:44px;cursor:pointer;text-decoration:underline;text-underline-offset:4px}
@keyframes pr{0%{transform:scale(.88);opacity:.7}100%{transform:scale(1.12);opacity:0}}
.rg{animation:pr 3.2s ease-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(30px) scale(.92)}to{opacity:1;transform:none}}
.rs{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes ld{from{transform:scaleX(.05)}to{transform:scaleX(.66)}}
.ld{transform-origin:left;animation:ld 1.8s cubic-bezier(.2,.8,.2,1) .3s both}

@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.gr{transform-origin:bottom;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
</style>

<style>html,body{background:#000}</style>
</head>
<body>

<main style="width:390px;height:844px;position:relative;overflow:hidden;color:#fff;display:flex;flex-direction:column;padding:56px 20px 28px;background:radial-gradient(75% 42% at 50% 18%,rgba(255,107,36,0.15),rgba(255,107,36,0) 72%),#101010"><svg width="390" height="844" style="position:absolute;inset:0;opacity:.07;mix-blend-mode:screen;pointer-events:none" aria-hidden="true"><filter id="nz"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2"/></filter><rect width="390" height="844" filter="url(#nz)"/></svg><div style="display:flex;align-items:center;justify-content:space-between;position:relative;z-index:3"><span class="gl" style="width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d='M19 12H5M11 6l-6 6 6 6'/></svg></span><span class="jk" style="font-weight:700;font-size:20px">New session</span><span style="min-width:44px;display:flex;justify-content:flex-end"></span></div>
<section class="gl" style="margin-top:16px;padding:18px 16px;position:relative"><div class="lab" style="text-align:center">Duration</div><div style="display:flex;align-items:center;justify-content:center;gap:18px;margin:6px 0 14px"><span class="gl" style="width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:500 26px Inter,sans-serif;color:#FF8A4C">−</span><div class="jk tn" style="font-weight:800;font-size:68px;line-height:68px;letter-spacing:-2px">25<span style="font:600 18px Inter,sans-serif;color:#A3A3A3;letter-spacing:0"> min</span></div><span class="gl" style="width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:500 26px Inter,sans-serif;color:#FF8A4C">+</span></div><div style="position:relative;height:22px;display:flex;align-items:center"><i style="position:absolute;left:0;right:0;height:8px;border-radius:4px;background:rgba(255,255,255,.1)"></i><i class="fb" style="position:absolute;left:0;width:21%;height:8px;border-radius:4px;background:#FF6B24;box-shadow:0 0 7px rgba(255,107,36,.05)"></i><i style="position:absolute;left:calc(21% - 11px);width:22px;height:22px;border-radius:50%;background:#fff;border:4px solid #FF6B24;box-shadow:0 0 8px rgba(255,107,36,.05)"></i></div><div style="display:flex;justify-content:space-between;font:500 11.5px Inter,sans-serif;color:#A3A3A3;margin-top:8px"><span>5 min</span><span>120 min</span></div></section>
<div style="margin-top:12px"><div style="display:flex;gap:8px;position:relative"><span class="tn" style="flex:1;text-align:center;height:40px;border-radius:20px;font:700 14px/40px Inter,sans-serif;background:rgba(255,255,255,.07);color:#fff;border:1px solid rgba(255,255,255,.1);line-height:38px">15 min</span><span class="tn" style="flex:1;text-align:center;height:40px;border-radius:20px;font:700 14px/40px Inter,sans-serif;background:#FF6B24;color:#101010;box-shadow:0 5px 12px rgba(255,107,36,.17)">25 min</span><span class="tn" style="flex:1;text-align:center;height:40px;border-radius:20px;font:700 14px/40px Inter,sans-serif;background:rgba(255,255,255,.07);color:#fff;border:1px solid rgba(255,255,255,.1);line-height:38px">45 min</span><span class="tn" style="flex:1;text-align:center;height:40px;border-radius:20px;font:700 14px/40px Inter,sans-serif;background:rgba(255,255,255,.07);color:#fff;border:1px solid rgba(255,255,255,.1);line-height:38px">60 min</span></div></div>
<div class="lab" style="margin:18px 0 6px;position:relative">Block while focusing</div>
<section class="gl" style="padding:2px 16px;position:relative"><div style="display:flex;align-items:center;gap:12px;height:52px"><span style="width:34px;height:34px;border-radius:11px;background:#E1306C;display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="4"/><path d="M10.5 9.5l3.5 2.5-3.5 2.5z"/></svg></span><span style="font:600 15px Inter,sans-serif;flex:1">Instagram Reels</span><span style="position:relative;margin-left:auto;flex:none;width:52px;height:32px;border-radius:16px;background:#FF6B24;padding:3px;display:flex;justify-content:flex-end"><i style="width:26px;height:26px;border-radius:50%;background:#101010"></i></span></div><div style="height:1px;background:rgba(255,255,255,.1)"></div><div style="display:flex;align-items:center;gap:12px;height:52px"><span style="width:34px;height:34px;border-radius:11px;background:#E5222B;display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="4"/><path d="M10.5 9.5l3.5 2.5-3.5 2.5z"/></svg></span><span style="font:600 15px Inter,sans-serif;flex:1">YouTube Shorts</span><span style="position:relative;margin-left:auto;flex:none;width:52px;height:32px;border-radius:16px;background:#FF6B24;padding:3px;display:flex;justify-content:flex-end"><i style="width:26px;height:26px;border-radius:50%;background:#101010"></i></span></div><div style="height:1px;background:rgba(255,255,255,.1)"></div><div style="display:flex;align-items:center;gap:12px;height:52px"><span style="width:34px;height:34px;border-radius:11px;background:#1877F2;display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="4"/><path d="M10.5 9.5l3.5 2.5-3.5 2.5z"/></svg></span><span style="font:600 15px Inter,sans-serif;flex:1">Facebook Reels</span><span style="position:relative;margin-left:auto;flex:none;width:52px;height:32px;border-radius:16px;background:#3A3A3A;padding:3px;display:flex;justify-content:flex-start"><i style="width:26px;height:26px;border-radius:50%;background:#101010"></i></span></div><div style="height:1px;background:rgba(255,255,255,.1)"></div><div style="display:flex;align-items:center;gap:12px;height:52px"><span style="width:34px;height:34px;border-radius:11px;background:#FFE600;display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="#101010" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="4"/><path d="M10.5 9.5l3.5 2.5-3.5 2.5z"/></svg></span><span style="font:600 15px Inter,sans-serif;flex:1">Snapchat Spotlight</span><span style="position:relative;margin-left:auto;flex:none;width:52px;height:32px;border-radius:16px;background:#3A3A3A;padding:3px;display:flex;justify-content:flex-start"><i style="width:26px;height:26px;border-radius:50%;background:#101010"></i></span></div></section>
<section class="gl" style="padding:2px 16px;margin-top:12px;position:relative"><div style="display:flex;align-items:center;gap:12px;min-height:60px"><div style="flex:1"><div style="font:700 15.5px Inter,sans-serif">Strict mode</div><div style="font:500 12.5px Inter,sans-serif;color:#A3A3A3">No early exit once started</div></div><span style="position:relative;margin-left:auto;flex:none;width:52px;height:32px;border-radius:16px;background:#3A3A3A;padding:3px;display:flex;justify-content:flex-start"><i style="width:26px;height:26px;border-radius:50%;background:#101010"></i></span></div></section>
<div style="flex:1"></div><button class="btn pg" style="position:relative">Start 25 min session</button></main>

</body>
</html>
