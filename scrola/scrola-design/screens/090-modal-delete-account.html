<style>
body{margin:0;font-family:'Inter',sans-serif}

*{animation:none !important}
}

@keyframes cin{0%,28%{opacity:0;transform:translateY(12px)}40%,90%{opacity:1;transform:none}100%{opacity:0}}
.cin{animation:cin 7s infinite}
@keyframes dimk{0%{opacity:0}16%,90%{opacity:1}100%{opacity:0}}
.dimk{animation:dimk 7s infinite}
@keyframes plr{0%,100%{box-shadow:0 0 0 0 rgba(255,82,82,.55)}50%{box-shadow:0 0 0 8px rgba(255,82,82,0)}}

.bnc2{animation:bounce 2.4s ease-out infinite}
@keyframes cd{from{stroke-dashoffset:0}to{stroke-dashoffset:100}}
.cd{animation:cd 30s linear infinite}

@keyframes shim{to{background-position:-200% 0}}
.sk{background:linear-gradient(90deg,#1E1E1E 25%,#2C2C2C 50%,#1E1E1E 75%);background-size:200% 100%;animation:shim 1.4s linear infinite;border-radius:14px}
@keyframes ach{0%{transform:scale(.3) rotate(-20deg);opacity:0}60%{transform:scale(1.12) rotate(4deg);opacity:1}100%{transform:none}}
.ach{animation:ach 1.1s cubic-bezier(.2,.8,.2,1) both}
